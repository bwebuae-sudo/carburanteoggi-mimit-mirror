name: Aggiorna mirror MIMIT

on:
  workflow_dispatch:

  schedule:
    - cron: "20 7,9,11,13 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scarica CSV MIMIT
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tmp latest

          STATIONS_URL="https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv"
          PRICES_URL="https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"

          echo "Download anagrafica..."

          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "$UA" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.7" \
            "$STATIONS_URL" \
            -o tmp/anagrafica_impianti_attivi.csv

          echo "Download prezzi..."

          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "$UA" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.7" \
            "$PRICES_URL" \
            -o tmp/prezzo_alle_8.csv

          STATIONS_SIZE=$(stat -c%s tmp/anagrafica_impianti_attivi.csv)
          PRICES_SIZE=$(stat -c%s tmp/prezzo_alle_8.csv)

          echo "Anagrafica: $STATIONS_SIZE byte"
          echo "Prezzi: $PRICES_SIZE byte"

          if [ "$STATIONS_SIZE" -lt 500000 ]; then
            echo "ERRORE: file anagrafica troppo piccolo"
            exit 1
          fi

          if [ "$PRICES_SIZE" -lt 500000 ]; then
            echo "ERRORE: file prezzi troppo piccolo"
            exit 1
          fi

          STATIONS_DATE=$(head -n 10 tmp/anagrafica_impianti_attivi.csv | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1 || true)
          PRICES_DATE=$(head -n 10 tmp/prezzo_alle_8.csv | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1 || true)

          echo "Data anagrafica: ${STATIONS_DATE:-NON TROVATA}"
          echo "Data prezzi: ${PRICES_DATE:-NON TROVATA}"

          if [ -z "$STATIONS_DATE" ] || [ -z "$PRICES_DATE" ]; then
            echo "ERRORE: data di estrazione non trovata"
            exit 1
          fi

          if [ "$STATIONS_DATE" != "$PRICES_DATE" ]; then
            echo "ERRORE: le due estrazioni MIMIT hanno date differenti"
            exit 1
          fi

          CURRENT_DATE=""

          if [ -f latest/extraction-date.txt ]; then
            CURRENT_DATE=$(cat latest/extraction-date.txt)
          fi

          echo "Dataset repository attuale: ${CURRENT_DATE:-nessuno}"
          echo "Dataset MIMIT scaricato: $STATIONS_DATE"

          if [ -n "$CURRENT_DATE" ] && [[ "$STATIONS_DATE" < "$CURRENT_DATE" ]]; then
            echo "ERRORE: dataset scaricato più vecchio di quello già archiviato"
            exit 1
          fi

          cp tmp/anagrafica_impianti_attivi.csv latest/anagrafica_impianti_attivi.csv
          cp tmp/prezzo_alle_8.csv latest/prezzo_alle_8.csv

          echo "$STATIONS_DATE" > latest/extraction-date.txt

          STATIONS_SHA=$(sha256sum latest/anagrafica_impianti_attivi.csv | cut -d' ' -f1)
          PRICES_SHA=$(sha256sum latest/prezzo_alle_8.csv | cut -d' ' -f1)

          printf '{\n' > latest/manifest.json
          printf '  "source": "MIMIT",\n' >> latest/manifest.json
          printf '  "extraction_date": "%s",\n' "$STATIONS_DATE" >> latest/manifest.json
          printf '  "stations_file": "anagrafica_impianti_attivi.csv",\n' >> latest/manifest.json
          printf '  "prices_file": "prezzo_alle_8.csv",\n' >> latest/manifest.json
          printf '  "stations_bytes": %s,\n' "$STATIONS_SIZE" >> latest/manifest.json
          printf '  "prices_bytes": %s,\n' "$PRICES_SIZE" >> latest/manifest.json
          printf '  "stations_sha256": "%s",\n' "$STATIONS_SHA" >> latest/manifest.json
          printf '  "prices_sha256": "%s"\n' "$PRICES_SHA" >> latest/manifest.json
          printf '}\n' >> latest/manifest.json

          echo "Mirror pronto per estrazione $STATIONS_DATE"

      - name: Pubblica aggiornamento
        shell: bash
        run: |
          set -e

          git config user.name "CarburanteOggi MIMIT Mirror"
          git config user.email "actions@github.com"

          git add latest/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          DATE=$(cat latest/extraction-date.txt)

          git commit -m "Aggiorna dati MIMIT ${DATE}"
          git push
