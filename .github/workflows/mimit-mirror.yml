name: Aggiorna mirror MIMIT

on:
  workflow_dispatch:

  schedule:
    - cron: "20 7,9,11,13 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scarica e valida i CSV MIMIT
        shell: bash
        run: |
          set -euo pipefail

          STATIONS_URL="https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv"
          PRICES_URL="https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"

          mkdir -p tmp latest

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36"

          echo "Download anagrafica..."
          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "$UA" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.7" \
            "$STATIONS_URL" \
            -o tmp/anagrafica_impianti_attivi.csv

          echo "Download prezzi..."
          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "$UA" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: it-IT,it;q=0.9,en;q=0.7" \
            "$PRICES_URL" \
            -o tmp/prezzo_alle_8.csv

          STATIONS_SIZE=$(stat -c%s tmp/anagrafica_impianti_attivi.csv)
          PRICES_SIZE=$(stat -c%s tmp/prezzo_alle_8.csv)

          echo "Anagrafica: ${STATIONS_SIZE} byte"
          echo "Prezzi: ${PRICES_SIZE} byte"

          if [ "$STATIONS_SIZE" -lt 500000 ]; then
            echo "ERRORE: file anagrafica troppo piccolo"
            exit 1
          fi

          if [ "$PRICES_SIZE" -lt 500000 ]; then
            echo "ERRORE: file prezzi troppo piccolo"
            exit 1
          fi

          STATIONS_DATE=$(
            head -n 10 tmp/anagrafica_impianti_attivi.csv |
            sed -nE 's/.*Estrazione del[[:space:]]+([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p' |
            head -n1
          )

          PRICES_DATE=$(
            head -n 10 tmp/prezzo_alle_8.csv |
            sed -nE 's/.*Estrazione del[[:space:]]+([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p' |
            head -n1
          )

          echo "Data anagrafica: ${STATIONS_DATE:-NON TROVATA}"
          echo "Data prezzi: ${PRICES_DATE:-NON TROVATA}"

          if [ -z "${STATIONS_DATE:-}" ] || [ -z "${PRICES_DATE:-}" ]; then
            echo "ERRORE: data di estrazione MIMIT non trovata"
            exit 1
          fi

          if [ "$STATIONS_DATE" != "$PRICES_DATE" ]; then
            echo "ERRORE: le due estrazioni hanno date differenti"
            exit 1
          fi

          NEW_DATE="$STATIONS_DATE"

          CURRENT_DATE=""
          if [ -f latest/manifest.json ]; then
            CURRENT_DATE=$(
              python3 - <<'PY'
import json
try:
    with open("latest/manifest.json", "r", encoding="utf-8") as f:
        print(json.load(f).get("extraction_date", ""))
except Exception:
    print("")
PY
            )
          fi

          echo "Dataset repository attuale: ${CURRENT_DATE:-nessuno}"
          echo "Dataset MIMIT scaricato: $NEW_DATE"

          if [ -n "$CURRENT_DATE" ] && [[ "$NEW_DATE" < "$CURRENT_DATE" ]]; then
            echo "ERRORE: il MIMIT ha restituito un dataset più vecchio di quello già archiviato"
            exit 1
          fi

          STATIONS_SHA=$(sha256sum tmp/anagrafica_impianti_attivi.csv | awk '{print $1}')
          PRICES_SHA=$(sha256sum tmp/prezzo_alle_8.csv | awk '{print $1}')

          OLD_STATIONS_SHA=""
          OLD_PRICES_SHA=""

          if [ -f latest/manifest.json ]; then
            OLD_STATIONS_SHA=$(
              python3 - <<'PY'
import json
try:
    with open("latest/manifest.json", "r", encoding="utf-8") as f:
        print(json.load(f).get("stations_sha256", ""))
except Exception:
    print("")
PY
            )

            OLD_PRICES_SHA=$(
              python3 - <<'PY'
import json
try:
    with open("latest/manifest.json", "r", encoding="utf-8") as f:
        print(json.load(f).get("prices_sha256", ""))
except Exception:
    print("")
PY
            )
          fi

          if [ "$NEW_DATE" = "$CURRENT_DATE" ] &&
             [ "$STATIONS_SHA" = "$OLD_STATIONS_SHA" ] &&
             [ "$PRICES_SHA" = "$OLD_PRICES_SHA" ]; then
            echo "Dataset già aggiornato: nessuna modifica necessaria."
            exit 0
          fi

          cp tmp/anagrafica_impianti_attivi.csv latest/anagrafica_impianti_attivi.csv
          cp tmp/prezzo_alle_8.csv latest/prezzo_alle_8.csv

          export NEW_DATE STATIONS_SHA PRICES_SHA STATIONS_SIZE PRICES_SIZE

          python3 - <<'PY'
import json
import os
from datetime import datetime, timezone

manifest = {
    "source": "MIMIT",
    "extraction_date": os.environ["NEW_DATE"],
    "downloaded_at_utc": datetime.now(timezone.utc).isoformat(),
    "stations_file": "anagrafica_impianti_attivi.csv",
    "prices_file": "prezzo_alle_8.csv",
    "stations_bytes": int(os.environ["STATIONS_SIZE"]),
    "prices_bytes": int(os.environ["PRICES_SIZE"]),
    "stations_sha256": os.environ["STATIONS_SHA"],
    "prices_sha256": os.environ["PRICES_SHA"]
}

with open("latest/manifest.json", "w", encoding="utf-8") as f:
    json.dump(manifest, f, indent=2, ensure_ascii=False)
    f.write("\n")
PY

          echo "Mirror pronto per estrazione $NEW_DATE"

      - name: Salva aggiornamento nel repository
        shell: bash
        run: |
          set -e

          git config user.name "CarburanteOggi MIMIT Mirror"
          git config user.email "actions@github.com"

          git add latest/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          DATE=$(
            python3 - <<'PY'
import json
with open("latest/manifest.json", "r", encoding="utf-8") as f:
    print(json.load(f)["extraction_date"])
PY
          )

          git commit -m "Aggiorna dati MIMIT ${DATE}"
          git push
